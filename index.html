<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0e8a4e">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Geocache Field Guide</title>
<style>

:root{--bg:#eef3ee;--card:#fff;--text:#1b1f24;--muted:#627067;--line:#d8e2d8;--accent:#0e8a4e;--accent-t:#fff;--topo:rgba(14,138,78,.13);
--virt:#2f7dd1;--earth:#2f9e5b;--warn:#b54708;--warnbg:#fff4e5;--ok:#1a7f45;--land:#eef0e8;--water:#bcd8ee;--park:#d3e6c8;--road:#ffffff;--roadline:#cfd2c8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c130f;--card:#141c17;--text:#e6ece8;--muted:#9aaa9f;--line:#25332a;--accent:#45c98a;--accent-t:#04140b;--topo:rgba(69,201,138,.1);--virt:#5aa2ee;--earth:#4cc07f;--warn:#f5a54a;--warnbg:#2a2113;--ok:#4cc07f;--land:#171b17;--water:#14283b;--park:#1a2b1c;--road:#2c3138;--roadline:#3a4048}}
:root[data-theme="dark"]{--bg:#0c130f;--card:#141c17;--text:#e6ece8;--muted:#9aaa9f;--line:#25332a;--accent:#45c98a;--accent-t:#04140b;--topo:rgba(69,201,138,.1);--virt:#5aa2ee;--earth:#4cc07f;--warn:#f5a54a;--warnbg:#2a2113;--ok:#4cc07f;--land:#171b17;--water:#14283b;--park:#1a2b1c;--road:#2c3138;--roadline:#3a4048}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 96px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
a{color:var(--accent)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:31;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 12px}
.tabs{display:flex;gap:8px;align-items:center}
.tabs button{flex:1;padding:9px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;font-weight:600;font-size:15px}
.tabs button.on{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.prog{font-size:12px;color:var(--muted);white-space:nowrap}
#chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;-webkit-overflow-scrolling:touch}
#chips button{flex:0 0 auto;min-width:34px;padding:5px 9px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:13px;font-weight:600}
#chips button.ok{background:var(--ok);border-color:var(--ok);color:#fff;opacity:.55}
main{max-width:720px;margin:0 auto;padding:12px}
h1{font-size:18px;margin:4px 0 8px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.btn,button.btn{display:inline-block;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:14px;font-weight:600;text-decoration:none;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.btn.danger{color:#b42318;border-color:#d92d20;background:color-mix(in srgb,#d92d20 7%,var(--card))}
.btn.sm{padding:5px 9px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
svg#map{width:100%;height:auto;display:block;border-radius:10px;background:var(--bg);border:1px solid var(--line);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
svg#map.panning{cursor:grabbing}.mapgesture{font-size:12px;color:var(--muted);margin:7px 0 3px}
#cap{font-size:13px;color:var(--muted);min-height:20px;margin:6px 0}
.lbl{fill:var(--muted);font-size:9px}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);position:relative}
.row:first-of-type{border-top:0}
.row.focus{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.row.dragging{opacity:.55;background:color-mix(in srgb,var(--accent) 12%,var(--card))}.row.dragover{box-shadow:inset 0 3px 0 var(--accent)}
.grab{flex:0 0 28px;align-self:stretch;border:0;background:transparent;color:var(--muted);font-size:21px;line-height:1;cursor:grab;touch-action:none;padding:0}.grab:active{cursor:grabbing;color:var(--accent)}
.idx{flex:0 0 24px;text-align:center;font-weight:700;color:var(--accent)}
.rt{flex:1;min-width:0}.rt b{display:block;font-size:15px}.rt small{color:var(--muted)}
.rt small.zero{color:var(--warn)}
h3{font-size:14px;margin:10px 0 2px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--virt);border-radius:14px;padding:12px;margin-bottom:14px;transition:background .5s,border-color .5s}
.card.earth{border-left-color:var(--earth)}
.card.done{background:color-mix(in srgb,var(--ok) 18%,var(--card));border-color:var(--ok)}
.chead{display:flex;gap:10px;align-items:flex-start}
.num{flex:0 0 28px;height:28px;border-radius:50%;background:var(--virt);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.earth .num{background:var(--earth)}
.card h2{font-size:17px;margin:0 0 2px;line-height:1.25}
.meta{font-size:13px;color:var(--muted)}
.pill{display:inline-block;border:1px solid var(--line);border-radius:12px;padding:1px 8px;font-size:12px;color:var(--text);margin-right:4px}
.pill.warn{border-color:var(--warn);color:var(--warn)}
.coords{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.ctext{font-family:ui-monospace,Menlo,monospace;font-size:14px}
.wps{font-size:13px;margin:0 0 8px;padding:0;list-style:none}
.wps li{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.policy{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:6px 10px;font-size:13px;margin:6px 0}
.req{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0;font-size:14px;white-space:pre-wrap;background:var(--bg);max-height:min(30vh,220px);overflow-y:auto}
.req b,.note{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.note{display:block;text-transform:none;margin:6px 0}
details{margin:8px 0}
summary{cursor:pointer;font-weight:600;font-size:14px;padding:4px 0}
.desc{white-space:pre-wrap;font-size:14px;max-height:min(38vh,260px);overflow-y:auto;overflow-wrap:anywhere;padding:8px 10px;margin-top:4px;border:1px solid var(--line);border-radius:10px;background:var(--bg);-webkit-overflow-scrolling:touch}
.task{margin:12px 0}
.task .q{display:flex;gap:8px;font-size:15px;font-weight:600;margin-bottom:5px}
.task .q span.n{flex:0 0 22px;color:var(--accent)}
textarea,input[type=text]{width:100%;font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text);resize:vertical}
textarea.ans{min-height:44px;overflow:hidden}
.edit{border:1px dashed var(--line);border-radius:10px;padding:8px;margin:8px 0}
.edit input{margin-top:6px;font-size:14px}
pre.prev{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px;font-size:13px;margin:6px 0 0;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.actions .btn{flex:1 1 auto;text-align:center;padding:9px 8px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.badge{display:inline-block;border-radius:8px;padding:3px 9px;font-size:12px;font-weight:700;margin:0 6px 4px 0}
.badge.req{background:var(--warn);color:var(--card)}
.badge.opt{border:1px solid var(--warn);color:var(--warn)}
.badge.none{border:1px solid var(--line);color:var(--muted);font-weight:600}
.ev{font-size:12px;color:var(--muted);margin:0 0 6px}
.qh{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 0}
.tag{color:var(--warn);font-weight:600}
.geo{fill:var(--muted);font-size:8px;font-style:italic;opacity:.85}
.opts{font-size:12px;color:var(--muted);margin:0 0 5px}
.ht{flex:1;min-width:0}
.hr{display:flex;align-items:center;gap:6px;margin-left:auto}
.dbadge{display:none;color:var(--ok);font-weight:700;font-size:13px;white-space:nowrap}
.card.done .dbadge{display:inline}
.card:not(.done) .reopen{display:none}
.cwrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows .5s ease}
.cwrap>.cinner{min-height:0;overflow:hidden;transition:visibility 0s}
.card.done .cwrap{grid-template-rows:0fr}
.card.done .cwrap>.cinner{visibility:hidden;transition:visibility 0s .5s}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.complete{display:block;width:100%;margin-top:8px;padding:13px;font-size:16px}
.qt{flex:1;min-width:0}
.pen{flex:0 0 auto;background:none;border:0;color:var(--muted);padding:2px 4px;cursor:pointer}
.pen.on{color:var(--accent)}
.pen svg{width:18px;height:18px;display:block}
.qdetail{margin:3px 0 7px 30px;color:var(--muted);font-size:13px}.qdetail b{color:var(--text)}
.edit .slab{margin-top:6px}.edit select{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
.photoanswer{margin:7px 0 0 30px}.photoanswer .btn{display:inline-flex;align-items:center;gap:6px}.photoanswer small{display:block;color:var(--muted);margin-top:4px}
.sprompt{display:block;min-height:2.4em;padding:4px 24px 4px 4px;border-radius:7px;color:var(--muted);font-size:12px;line-height:1.35;position:relative;cursor:text}.sprompt::after{content:"✎";position:absolute;right:5px;top:4px;opacity:.55}.sprompt:hover,.sprompt:focus{background:color-mix(in srgb,var(--accent) 8%,transparent);outline:1px solid color-mix(in srgb,var(--accent) 30%,transparent);color:var(--text)}
.personalnotes textarea{width:100%;min-height:82px;margin-top:8px}.finalhide{margin-top:9px}.checkerrow{margin-top:8px}
.scene{position:relative;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;min-height:calc(100vh - 130px);min-height:calc(100dvh - 130px);
  border-radius:24px;padding:14px 14px 18px;margin-bottom:12px;color:#fff;
  background:radial-gradient(130% 80% at 50% -10%,#41a062 0%,#27704c 38%,#154832 74%,#0c2d20 100%);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.scene .orb{position:absolute;z-index:-1;border-radius:50%;filter:blur(38px);opacity:.5;animation:orbf 16s ease-in-out infinite alternate}
.orb.o1{width:230px;height:230px;background:#8cf0b0;top:-70px;left:-60px}
.orb.o2{width:260px;height:260px;background:#f4b04a;opacity:.26;bottom:90px;right:-90px;animation-delay:-6s}
.orb.o3{width:200px;height:200px;background:#2fd0c0;opacity:.3;bottom:-60px;left:-30px;animation-delay:-11s}
@keyframes orbf{from{transform:translate(0,0) scale(1)}to{transform:translate(26px,-22px) scale(1.15)}}
@media (prefers-reduced-motion:reduce){.scene .orb{animation:none}}
.shead{display:flex;gap:10px;align-items:center}
.shead b{display:block;font-size:17px;line-height:1.2}.shead span:not(.num){font-size:13px;opacity:.8}
.shead .num{background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.35);color:#fff}
.dwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:10px 0 4px}
.dial{position:relative;width:min(94vw,56vh,460px);width:min(94vw,56dvh,460px);aspect-ratio:1;}
.dial>*{position:absolute}
/* brushed-brass bezel */
.dial .bezel{inset:2.63%;border-radius:50%;
  background:repeating-radial-gradient(circle,rgba(255,255,255,.07) 0 1px,rgba(0,0,0,.05) 1px 3px),
    conic-gradient(from 205deg,#6a4c1a,#f8e8ab 8%,#b18b3d 17%,#58401a 29%,#e4c670 41%,#fff7d2 49%,#a98334 59%,#57401a 71%,#d8b660 83%,#f5e099 92%,#6a4c1a);
  box-shadow:inset 0 2px 3px rgba(255,255,255,.75),inset 0 -6px 10px rgba(0,0,0,.6),0 24px 44px rgba(0,0,0,.6),0 3px 0 rgba(0,0,0,.35)}
.dial .bezel::before{content:"";position:absolute;inset:2.4%;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(60,40,10,.55),0 0 0 1px rgba(255,240,190,.35)}
/* engraved dark compass card with a machined lip */
.dial .face{inset:10%;border-radius:50%;
  background:repeating-radial-gradient(circle,rgba(255,255,255,.03) 0 1px,transparent 1px 4px),radial-gradient(circle at 50% 36%,#26372f 0%,#111c17 56%,#070d0a 100%);
  box-shadow:0 0 0 2px rgba(0,0,0,.65),0 0 0 3.5px rgba(246,224,150,.55),inset 0 12px 30px rgba(0,0,0,.9),inset 0 -6px 16px rgba(255,255,255,.05)}
/* recessed centre plate with brass ring */
.dial .plate{inset:31.05%;border-radius:50%;
  background:radial-gradient(circle at 36% 26%,#33473d 0%,#0f1914 72%);
  box-shadow:0 0 0 3px #b99645,0 0 0 4.5px rgba(0,0,0,.6),0 6px 14px rgba(0,0,0,.65),inset 0 7px 16px rgba(0,0,0,.85),inset 0 -2px 6px rgba(255,255,255,.08)}
.dial .center{inset:31.05%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;color:#f6e9c1}
.dial svg{inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
/* glass dome with a highlight that slides as the phone tilts */
.dial .dome{inset:10%;border-radius:50%;pointer-events:none;
  background:radial-gradient(120% 90% at 30% 14%,rgba(255,255,255,.4) 0%,rgba(255,255,255,.11) 34%,rgba(255,255,255,0) 56%),
    radial-gradient(90% 60% at 72% 104%,rgba(255,255,255,.16),rgba(255,255,255,0) 60%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),inset 0 -8px 20px rgba(255,255,255,.06)}
.big{font-size:clamp(34px,10.5vw,54px);font-weight:300;letter-spacing:-1px;line-height:1;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.big.sm{font-size:clamp(26px,8vw,38px);font-weight:600;letter-spacing:.02em}
.unit{font-size:clamp(11px,3.4vw,15px);font-weight:400;letter-spacing:.1em;text-transform:uppercase;margin-top:3px;opacity:.9}
.acc{font-size:11px;font-weight:400;letter-spacing:.03em;color:rgba(255,255,255,.4);margin-top:-2px}
#dsvg2 .wframe{transition:stroke .3s,filter .3s}
.dial.aligned #dsvg2 .wframe{stroke:#5cf593;filter:drop-shadow(0 0 5px #4cff94)}
.dial.arrived .ca{fill:#9dffbf}.dial.arrived .cb{fill:#2fbf6b}
.gnote{font-size:12px;opacity:.78;text-align:center;margin-top:6px}
.gbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.gbtn{padding:9px 15px;border-radius:999px;border:1px solid rgba(255,255,255,.38);background:rgba(255,255,255,.14);color:#fff;font:inherit;font-weight:600;font-size:14px;text-decoration:none;cursor:pointer;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 1px 1px rgba(255,255,255,.4)}
.gbtn.p{background:rgba(255,255,255,.3)}
.ghelp{margin-top:12px;border-top:1px solid rgba(255,255,255,.2);padding-top:6px}
.ghelp summary{font-size:13px;opacity:.85}.ghelp .hbody{font-size:13px}.ghelp p{margin:8px 0}
.dial .cover{inset:10%;border-radius:50%;z-index:3;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center;
  background:rgba(8,36,25,.55);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border:1px solid rgba(255,255,255,.38);box-shadow:inset 0 1px 1px rgba(255,255,255,.5)}
.dial.nocompass .cover{display:flex}
.cover .gbtn{font-size:17px;padding:13px 24px}
.nd{font-weight:700;font-size:14px;white-space:nowrap}

body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--topo);
  -webkit-mask:var(--topo-img) center/cover no-repeat;mask:var(--topo-img) center/cover no-repeat}
main{position:relative;z-index:1}
header{border-bottom:2px solid color-mix(in srgb,var(--accent) 60%,var(--line))}
.logo{flex:0 0 auto;width:26px;height:26px}
.scene::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:rgba(255,255,255,.075);
  -webkit-mask:var(--topo-img) center/cover no-repeat;mask:var(--topo-img) center/cover no-repeat}
.tabs button.iconbtn{flex:0 0 42px;padding:9px 0;display:flex;align-items:center;justify-content:center}
.iconbtn svg{width:19px;height:19px}
.dtext{width:100%;font:12px/1.4 ui-monospace,Menlo,monospace;margin:8px 0;white-space:pre;overflow:auto}
#impmsg.err{color:#d14343}#impmsg.okm{color:var(--ok)}
input[type=file]{font-size:14px;margin:6px 0;max-width:100%}
.legend{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
/* ===== v2 additions ===== */
.card{border-left-color:var(--tc,var(--accent))}
.card .num{background:var(--tc,var(--accent))}
.t-Virtual{--tc:var(--virt)}.t-EarthCache{--tc:var(--earth)}.t-Multi{--tc:#e08a1e}.t-Puzzle{--tc:#8e5bd0}.t-Traditional{--tc:#2f9e5b}
.pill.tag{background:color-mix(in srgb,var(--tc,var(--accent)) 14%,transparent);font-weight:600;color:var(--text)}
.wide{display:block;width:100%;text-align:center;margin-top:8px;padding:12px;font-size:16px}
.actions2{margin-top:12px}
.chks{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px}
.chk{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;cursor:pointer;margin:8px 0 0}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.chk[hidden]{display:none}
.menu{position:relative}
.menu summary{list-style:none;cursor:pointer;padding:0 8px;font-size:22px;line-height:1.2;color:var(--muted)}
.menu summary::-webkit-details-marker{display:none}
.mpop{position:absolute;right:0;top:100%;z-index:20;min-width:200px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:6px;display:flex;flex-direction:column}
.mpop button{background:none;border:0;text-align:left;padding:11px 12px;font:inherit;color:var(--text);border-radius:8px;cursor:pointer}
.mpop button:hover{background:var(--bg)}
.stage{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:8px 0;background:var(--bg)}
.stage>summary{display:flex;align-items:center;gap:8px;list-style:none;cursor:pointer}
.stage>summary::-webkit-details-marker{display:none}
.sn{flex:0 0 24px;height:24px;border-radius:50%;background:var(--tc,var(--accent));color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.stt{flex:1;font-weight:600}.sck{color:var(--ok);font-weight:700}
.stage.sdone{border-color:var(--ok)}
.stagecomplete{position:relative;display:flex;align-items:center;gap:11px;max-width:320px;margin:12px 0 2px;padding:10px 14px 10px 11px;border:1px solid var(--line);border-radius:999px;background:var(--card);cursor:pointer;overflow:visible;transition:border-color .2s ease,background .2s ease,box-shadow .2s ease,transform .16s ease;-webkit-tap-highlight-color:transparent}
.stagecomplete:hover{border-color:color-mix(in srgb,var(--ok) 55%,var(--line));background:color-mix(in srgb,var(--ok) 5%,var(--card))}
.stagecomplete:active{transform:scale(.985)}
.stagecomplete input{position:absolute;inline-size:1px;block-size:1px;opacity:0;pointer-events:none}
.stagecheck{display:grid;place-items:center;flex:0 0 32px;height:32px;border:2px solid color-mix(in srgb,var(--muted) 62%,transparent);border-radius:50%;background:var(--bg);color:#fff;transition:border-color .2s ease,background .2s ease,box-shadow .2s ease,transform .2s ease}
.stagecheck svg{width:18px;height:18px;overflow:visible}.stagecheck path{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22}
.stagemsg{min-width:0;line-height:1.15}.stagemsg b{display:block;font-size:14px}.stagemsg small{display:block;margin-top:3px;color:var(--muted);font-size:11px;font-weight:500}
.stagecomplete:has(input:focus-visible){outline:3px solid color-mix(in srgb,var(--accent) 32%,transparent);outline-offset:2px}
.stagecomplete:has(input:checked){border-color:color-mix(in srgb,var(--ok) 58%,var(--line));background:color-mix(in srgb,var(--ok) 10%,var(--card));box-shadow:0 4px 16px color-mix(in srgb,var(--ok) 12%,transparent)}
.stagecomplete:has(input:checked) .stagecheck{border-color:var(--ok);background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 13%,transparent)}
.stagecomplete:has(input:checked) .stagecheck path{stroke-dashoffset:0}
.stagecomplete.justdone{animation:stageDoneLift .52s cubic-bezier(.2,.9,.25,1)}
.stagecomplete.justdone::after{content:"";position:absolute;inset:-3px;border:2px solid var(--ok);border-radius:999px;pointer-events:none;animation:stageDoneRipple .58s ease-out both}
.stagecomplete.justdone .stagecheck{animation:stageCheckPop .46s cubic-bezier(.2,1.35,.4,1)}
.stagecomplete.justdone .stagecheck path{animation:stageCheckDraw .42s .06s ease-out both}
@keyframes stageDoneLift{0%{transform:scale(1)}38%{transform:scale(1.025) translateY(-1px)}100%{transform:scale(1)}}
@keyframes stageDoneRipple{0%{opacity:.55;transform:scale(.97)}100%{opacity:0;transform:scale(1.045)}}
@keyframes stageCheckPop{0%{transform:scale(.72)}58%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes stageCheckDraw{from{stroke-dashoffset:22}to{stroke-dashoffset:0}}
.stage .hint{color:var(--muted);font-size:13px;margin:8px 0}
.stage details.sub{margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:8px}
.grid label{display:block;font-size:12px;color:var(--muted)}
.grid input,.slab input,.edit input,input[type=text]{width:100%;font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text);margin-top:3px}
.choices{display:grid;gap:7px;margin:9px 0}.choice{display:flex;align-items:flex-start;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer}.choice:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--card))}.choice input{margin-top:3px}.choice span{display:block}.choice small{display:block;color:var(--muted);margin-top:2px}
.f{margin-top:10px}.f .lab{font-size:.8rem;color:var(--muted);margin-bottom:3px}
.eq{display:flex;flex-wrap:wrap;align-items:flex-end;gap:2px;font-family:ui-monospace,Menlo,monospace}
.tok{display:inline-flex;flex-direction:column;align-items:center;background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:6px;padding:2px 6px;min-width:26px}
.tok i{font-style:normal;font-size:.7rem;color:var(--muted)}.tok b{font-size:1.05rem;color:var(--accent)}
.tok.miss b{color:var(--muted)}.tok.bad b{color:var(--warn)}
.lit{font-size:1.2rem;padding:0 1px;font-family:ui-monospace,Menlo,monospace}
.res{margin-top:10px;padding:10px;border-radius:10px;background:color-mix(in srgb,var(--accent) 10%,transparent)}
.res .c{font-family:ui-monospace,Menlo,monospace;font-size:1.05rem}
.res .btns{margin-top:8px}
.warn{color:var(--warn);font-size:.85rem;margin-top:6px}
@media (prefers-reduced-motion:reduce){.stagecomplete,.stagecheck{transition:none}.stagecomplete.justdone,.stagecomplete.justdone::after,.stagecomplete.justdone .stagecheck,.stagecomplete.justdone .stagecheck path{animation:none}}
.scopebar{display:flex;align-items:center;gap:10px;margin:0 0 10px}.scopebar span{color:var(--muted);font-size:13px}
.triprow{display:flex;gap:8px;align-items:center;margin-bottom:8px}.triprow select{flex:1;min-width:0}
select{font:inherit;font-size:16px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);max-width:100%}
.drawer{position:fixed;inset:0;z-index:50;pointer-events:none}.drawer.open{pointer-events:auto}
.dback{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;transition:opacity .2s}.drawer.open .dback{opacity:1}
.dpanel{position:absolute;left:0;top:0;bottom:0;width:min(86vw,360px);background:var(--card);color:var(--text);padding:calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));overflow:auto;transform:translateX(-102%);transition:transform .22s;box-shadow:6px 0 30px rgba(0,0,0,.3)}
.drawer.open .dpanel{transform:none}
.dhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:18px}
.drawer h4{margin:14px 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.drow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font:inherit;margin-bottom:6px;cursor:pointer}
.drow.cur{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--bg))}
.drow b{display:block;font-size:15px}.drow small{color:var(--muted)}.de{font-size:20px}

<script>
'use strict';
/* ================= Geocache Field Guide v2 ================= */
const KEY = 'gfs2';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, m => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[m]));
const linkify = s => esc(s).replace(/(https?:\/\/[^\s<]+[^\s<.,;:)!?])/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
const TYPES = {Traditional: '🟢', Multi: '🟠', Puzzle: '🧩', EarthCache: '🌍', 'Letterbox Hybrid': '📮', Wherigo: '🧭', Event: '📅', 'Mega-Event': '🎪', Virtual: '🌐', Webcam: '📷', 'Adventure Lab': '📍', Other: '❓'};
const emo = t => TYPES[t] || '❓';
function normType(t) {
  const s = String(t || '').toLowerCase();
  if (/earth/.test(s)) return 'EarthCache'; if (/virtual/.test(s)) return 'Virtual'; if (/webcam/.test(s)) return 'Webcam';
  if (/multi/.test(s)) return 'Multi'; if (/mystery|unknown|puzzle/.test(s)) return 'Puzzle'; if (/letterbox/.test(s)) return 'Letterbox Hybrid';
  if (/wherigo/.test(s)) return 'Wherigo'; if (/mega/.test(s)) return 'Mega-Event'; if (/event/.test(s)) return 'Event';
  if (/adventure|\blab\b/.test(s)) return 'Adventure Lab'; if (/trad/.test(s)) return 'Traditional';
  return TYPES[t] ? t : 'Other';
}
function firstGrapheme(s) {                 // first visible character, so any emoji (including multi-part ones) works as a list icon
  s = String(s || '').trim(); if (!s) return '';
  try { const it = new Intl.Segmenter(undefined, {granularity: 'grapheme'}).segment(s)[Symbol.iterator]().next(); return it.value ? it.value.segment : ''; }
  catch (e) { return Array.from(s)[0] || ''; }
}
const hash = s => { let h = 5381; for (const ch of String(s)) h = ((h << 5) + h + ch.charCodeAt(0)) | 0; return Math.abs(h).toString(36).toUpperCase(); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 5);

/* ---------- storage ---------- */
const freshDB = () => ({v: 2, caches: {}, trips: [], prog: {}, ui: {tab: 'field', scope: {k: 'unstarted'}, planTrip: null, importDest: 'file', importMode: 'merge', lastExport: 0, decl: -10.1, north: 'true', mapProvider: 'simple', cartoKey: ''}});
let DB = (() => {
  try { const r = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (r && r.v === 2) { const f = freshDB(); return Object.assign(f, r, {ui: Object.assign(f.ui, r.ui || {})}); } } catch (e) {}
  return freshDB();
})();
let STORAGE_ERROR = '';
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(DB)); STORAGE_ERROR = ''; document.getElementById('storage-warning')?.remove(); return true; } catch (e) {
  STORAGE_ERROR = 'Changes are only in memory: browser storage is unavailable or full. Export everything now to keep your work.';
  let n = document.getElementById('storage-warning'); if (!n) { n = document.createElement('div'); n.id = 'storage-warning'; n.className = 'warnbox'; n.setAttribute('role', 'alert'); document.body.prepend(n); } n.textContent = STORAGE_ERROR; return false;
} };
const UI = DB.ui;
if (!['trip', 'inprog', 'unstarted', 'logged'].includes((UI.scope || {}).k)) UI.scope = {k: 'unstarted'};
if (!UI.mapProvider) UI.mapProvider = UI.mapBg === false ? 'off' : 'simple';   // old 'solo' / 'all' / 'parked' scopes
if (UI.mapProvider === 'usgs') UI.mapProvider = 'simple';                     // migrate the old busy default
const C = code => DB.caches[code];
const prog = code => DB.prog[code] || {};
function PR(code) { const p = DB.prog[code] || (DB.prog[code] = {sent: false, logged: false, parked: false, notes: '', solved: ''}); p.ans = p.ans || {}; p.st = p.st || {}; return p; }
const EDIT = {};                       // transient: which question rows are in edit mode

/* ---------- geometry ---------- */
function hav(a, b) {
  const R = 3958.8, r = Math.PI / 180, dp = (b[0] - a[0]) * r, dl = (b[1] - a[1]) * r;
  const h = Math.sin(dp / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dl / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function bearing(a, b) {
  const r = Math.PI / 180, p1 = a[0] * r, p2 = b[0] * r, dl = (b[1] - a[1]) * r;
  const y = Math.sin(dl) * Math.cos(p2), x = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl);
  return (Math.atan2(y, x) / r + 360) % 360;
}
const wrap180 = d => ((d % 360) + 540) % 360 - 180;
const unwrap = (prev, next) => prev == null ? next : prev + wrap180(next - prev);
const fmtDist = mi => mi < 0.1 ? `${Math.round(mi * 5280)} ft` : `${mi.toFixed(2)} mi`;
/* "N 38° 53.103 W 077° 02.175" or "38.8850, -77.0363" -> [lat, lon] */
function parseLoc(t) {
  t = String(t == null ? '' : t);
  let m = t.match(/([NS])\s*(\d{1,2})\D+?(\d+(?:\.\d+)?)\D*?\s*([EW])\s*(\d{1,3})\D+?(\d+(?:\.\d+)?)/i);
  if (m) { let la = +m[2] + m[3] / 60, lo = +m[5] + m[6] / 60; if (/s/i.test(m[1])) la = -la; if (/w/i.test(m[4])) lo = -lo; return [la, lo]; }
  m = t.match(/(-?\d{1,2}\.\d+)\s*[,;\s]\s*(-?\d{1,3}\.\d+)/);
  return m ? [+m[1], +m[2]] : null;
}
function dmText(lat, lon) {
  const f = (v, p, n) => { const a = Math.abs(v), d = Math.floor(a); return `${v >= 0 ? p : n} ${d}° ${((a - d) * 60).toFixed(3)}`; };
  return f(lat, 'N', 'S') + ' ' + f(lon, 'E', 'W');
}
const DECL_VAL = () => (isFinite(+UI.decl) ? +UI.decl : -10.1);
const mapsLink = (la, lo) => `https://www.google.com/maps?q=${la.toFixed(6)},${lo.toFixed(6)}`;

/* ---------- normalising records from any source (app saves, Playwright scraper, Shortcut) ---------- */
function normQuestions(arr) {
  if (!Array.isArray(arr)) return [];
  const out = [], seen = new Set();
  arr.forEach((q, i) => {
    if (q == null) return;
    const o = typeof q === 'string' ? {prompt: q} : q;
    const prompt = String(o.prompt || o.question || o.text || o.instructions || '').trim();
    const title = String(o.title || '').trim(), location = String(o.location || '').trim(), context = String(o.context || '').trim(), instructions = String(o.instructions || '').trim();
    let type = String(o.type || o.answer_type || 'text').toLowerCase().replace(/[_ ]+/g, '-');
    if (['photo', 'photograph', 'camera'].includes(type)) type = 'image';
    if (['short', 'short-text', 'observation'].includes(type)) type = 'text';
    if (!['text', 'textarea', 'number', 'choice', 'confirmation', 'image'].includes(type)) type = 'text';
    if (!prompt && !title && !instructions && type !== 'image') return;
    let id = typeof o.id === 'string' && o.id && !seen.has(o.id) ? o.id : 'q' + (i + 1);
    while (seen.has(id)) id = 'q' + uid();
    seen.add(id);
    const n = String(o.n != null ? o.n : o.label != null ? o.label : '').trim().replace(/[.):]+$/, '');
    const options = Array.isArray(o.options) ? o.options.filter(x => x && x.text).map(x => ({label: String(x.label || ''), text: String(x.text)})) : [];
    const answerFields = (Array.isArray(o.answerFields) ? o.answerFields : Array.isArray(o.answer_fields) ? o.answer_fields : []).map((f, j) => typeof f === 'string' ? {id: 'a' + (j + 1), label: f, type: 'text', unit: '', placeholder: ''} : ({
      id: String(f.id || 'a' + (j + 1)), label: String(f.label || f.prompt || 'Answer ' + (j + 1)), type: String(f.type || 'text'), unit: String(f.unit || ''), placeholder: String(f.placeholder || '')
    }));
    out.push(Object.assign({}, o, {id, n, prompt, title, type, location, context, instructions, options, answerFields}));
  });
  return out;
}
function normStages(arr) {
  if (!Array.isArray(arr)) return [];
  return arr.map((s, i) => ({...s,
    id: String(s.id || 's' + (i + 1)), title: String(s.title || 'Stage ' + (i + 1)), note: String(s.note || ''), desc: String(s.desc || ''),
    inputs: (Array.isArray(s.inputs) ? s.inputs : []).map(d => ({...d, id: String(d.id || d.L || d.letters || ''), l: String(d.l || d.label || ''), L: String(d.L || d.letters || '').toUpperCase(), date: !!d.date, num: !!d.num, kind: String(d.kind || (d.text ? 'text' : '')), ph: String(d.ph || '')})),
    choices: (Array.isArray(s.choices) ? s.choices : []).map((d, j) => ({id: String(d.id || 'c' + (j + 1)), label: String(d.label || d.answer || 'Option ' + (j + 1)), coords: String(d.coords || ''), note: String(d.note || '')})).filter(d => d.coords),
    N: String(s.N || ''), S: String(s.S || ''), W: String(s.W || ''), E: String(s.E || ''), coords: String(s.coords || ''),
    finalDetails: String(s.finalDetails || s.final_details || s.hide || s.hide_details || ''),
    checker: (Array.isArray(s.checker) ? s.checker : s.checker ? [s.checker] : []).map(x => typeof x === 'string' ? {label: /certitude/i.test(x) ? 'Certitude' : 'Coordinate checker', url: x} : ({label: String(x.label || 'Coordinate checker'), url: String(x.url || '')})).filter(x => x.url)}));
}
const KNOWN = new Set(['code', 'gc', 'gc_code', 'name', 'title', 'type', 'cache_type', 'url', 'link', 'owner', 'coords', 'coords_text', 'coordinates', 'lat', 'lon', 'd', 't', 'difficulty', 'terrain', 'size', 'description', 'logging', 'logging_section', 'logging_requirements', 'photo', 'photo_required', 'photo_note', 'policy', 'policy_notes', 'questions', 'tasks', 'stages', 'checker', 'waypoints', 'images', 'hint', 'links', 'personal_note', 'personal_notes', 'auto_stages', 'extra', 'imported', 'source_record', 'stage_layout_version','owner_answers_required']);
let IMG_SINK = [];     // data-URL images found while importing; stored in IndexedDB after a successful import

    <i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i>
    <div class="shead"><div><b>${esc(NAV.target.name)}</b><span>${esc(dmText(lat, lon))}</span></div><button class="gbtn" data-act="closecompass">Close</button></div>
    <div class="dwrap">
      <div class="dial nocompass" id="dial">
        <div class="bezel"></div><div class="face"></div><div class="plate"></div>
        <div class="center"><div id="ndist" class="big">—</div><div id="nunit" class="unit">&nbsp;</div></div>
        <svg id="dsvg" viewBox="-190 -190 380 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Direction to the destination">
          <defs>
            <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            <radialGradient id="screw" cx="35%" cy="30%"><stop offset="0" stop-color="#fff3c4"/><stop offset=".55" stop-color="#b08a3c"/><stop offset="1" stop-color="#4d3710"/></radialGradient>
          </defs>
